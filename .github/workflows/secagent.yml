name: SecAgent checks

on:
  push:
    branches:
      - feat/secagent-security-kernel
    paths:
      - "packages/secagent/**"
      - "packages/coding-agent/**"
      - "packages/web-ui/**"
      - ".pi/sandbox.json"
      - ".mcp.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/secagent.yml"
  pull_request:
    paths:
      - "packages/secagent/**"
      - "packages/coding-agent/**"
      - "packages/web-ui/**"
      - ".pi/sandbox.json"
      - ".mcp.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/secagent.yml"

jobs:
  secagent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install monorepo dependencies
        run: npm install --ignore-scripts

      - name: Report lockfile drift
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            echo "::warning::package-lock.json is stale for the SecAgent workspace changes; regenerate it locally before release."
          fi

      - name: Verify legacy project SecAgent files are gone
        shell: bash
        run: |
          test ! -e .pi/secagent
          test ! -e .pi/agents/sec-recon.md
          test ! -e .pi/agents/sec-web.md
          test ! -e .pi/agents/sec-analysis.md
          test ! -e .pi/agents/sec-response.md
          test ! -e .pi/extensions/security-agent.ts
          test ! -e .pi/extensions/security-report.ts

      - name: Run SecAgent package tests
        run: npm run test --workspace=@earendil-works/pi-secagent

      - name: Run coding-agent mode tests
        run: npm run test --workspace=@earendil-works/pi-coding-agent -- test/args.test.ts test/session-manager/agent-mode.test.ts

      - name: Run focused Web mode tests
        working-directory: packages/web-ui
        run: node --experimental-strip-types --test components/SecAgentWorkspace.test.mjs lib/agent-mode.test.mjs

      - name: Hydrate generated model data
        run: npm run hydrate:model-data

      - name: Type-check repository
        run: npx tsgo --noEmit
